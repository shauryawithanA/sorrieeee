<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; overflow: hidden; display: grid; place-items: center;
    font-family: Georgia, "Times New Roman", serif;
    background: #f7a6c5;
    animation: bgPop .9s cubic-bezier(.2,.8,.2,1) both;
    color: #7c1745;
  }
  @keyframes bgPop {
    0% { background: #fff0f5; }
    55% { background: #ffb5d0; }
    100% { background: #f48ab6; }
  }
  .scene {
    position: relative; width: min(92vw, 620px); height: min(88vh, 720px);
    display: grid; place-items: center; isolation: isolate;
  }
  .decor {
    position: absolute; inset: -8%; pointer-events: none; z-index: -1;
    color: rgba(166, 28, 85, .48); font-family: Georgia, serif;
  }
  .decor span { position: absolute; opacity: 0; animation: floatIn 1.2s ease forwards; }
  .decor span:nth-child(1) { left: 5%; top: 12%; font-size: 42px; animation-delay: .4s; }
  .decor span:nth-child(2) { right: 8%; top: 10%; font-size: 32px; animation-delay: .7s; }
  .decor span:nth-child(3) { left: 10%; bottom: 15%; font-size: 35px; animation-delay: .9s; }
  .decor span:nth-child(4) { right: 6%; bottom: 12%; font-size: 48px; animation-delay: .55s; }
  .decor span:nth-child(5) { left: 47%; top: 2%; font-size: 24px; animation-delay: 1s; }
  .decor span:nth-child(6) { right: 25%; bottom: 2%; font-size: 25px; animation-delay: 1.1s; }
  @keyframes floatIn {
    from { opacity: 0; transform: translateY(18px) scale(.65) rotate(-15deg); }
    to { opacity: .8; transform: translateY(0) scale(1) rotate(0); }
  }
  .envelope-wrap { position: relative; width: min(78vw, 430px); height: 300px; margin-top: 50px; }
  .envelope {
    position: absolute; inset: 0; border-radius: 12px;
    background: #d92f78;
    box-shadow: 0 24px 55px rgba(119, 16, 61, .25);
    animation: envelopeIn .8s .5s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes envelopeIn {
    from { opacity: 0; transform: translateY(80px) scale(.75); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .front {
    position: absolute; inset: 0; border-radius: 12px; overflow: hidden;
    background: linear-gradient(145deg, #ed4b91, #c91f68);
    clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);
    z-index: 4;
  }
  .front::before, .front::after {
    content: ""; position: absolute; bottom: 0; width: 0; height: 0;
    border-style: solid; opacity: .55;
  }
  .front::before { left: 0; border-width: 150px 0 0 215px; border-color: transparent transparent transparent #b91c5b; }
  .front::after { right: 0; border-width: 150px 215px 0 0; border-color: transparent #b91c5b transparent transparent; }
  .flap {
    position: absolute; inset: 0 0 auto 0; height: 60%;
    background: linear-gradient(145deg, #f45b9d, #d72a76);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center; z-index: 5;
    animation: flapOpen 1s 1.45s cubic-bezier(.2,.7,.2,1) forwards;
  }
  @keyframes flapOpen {
    0% { transform: rotateX(0); z-index: 5; }
    99% { z-index: 5; }
    100% { transform: rotateX(180deg); z-index: 1; }
  }
  .photo-card {
    position: absolute; z-index: 3; width: 72%; left: 14%; bottom: 22px;
    padding: 10px 10px 13px; background: #ffe2ee;
    border: 5px solid #f7a1c5; border-radius: 8px;
    box-shadow: 0 12px 25px rgba(94, 9, 46, .22);
    transform: translateY(0) scale(.8); opacity: 0;
    animation: photoRise 1.05s 2.05s cubic-bezier(.16,.85,.3,1) forwards;
  }
  @keyframes photoRise {
    0% { opacity: 0; transform: translateY(35px) scale(.8) rotate(-3deg); }
    65% { opacity: 1; transform: translateY(-185px) scale(1.02) rotate(2deg); }
    100% { opacity: 1; transform: translateY(-175px) scale(1) rotate(0); }
  }
  .photo-card img {
    display: block; width: 100%; height: 225px; object-fit: cover;
    object-position: center 38%; transform: scaleX(-1);
    border: 2px solid #f5a0c4; border-radius: 3px;
  }
  .caption {
    position: absolute; top: calc(100% + 38px); left: 50%; width: 100vw;
    transform: translateX(-50%) translateY(10px); text-align: center;
    font-size: clamp(23px, 5vw, 34px); font-weight: bold;
    color: #8c174d; text-shadow: 0 2px 0 rgba(255,255,255,.35);
    opacity: 0; animation: captionIn .7s 2.8s ease forwards;
  }
  @keyframes captionIn { to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  .heart {
    position: absolute; color: #c52268; opacity: 0;
    animation: heartFloat 3.5s ease-in-out infinite;
  }
  .heart.h1 { left: -5%; top: 30%; font-size: 25px; animation-delay: 2.8s; }
  .heart.h2 { right: -3%; top: 43%; font-size: 31px; animation-delay: 3.2s; }
  @keyframes heartFloat {
    0% { opacity: 0; transform: translateY(12px) scale(.7); }
    25%, 75% { opacity: .8; }
    100% { opacity: 0; transform: translateY(-32px) scale(1.15); }
  }
  @media (max-height: 650px) {
    .scene { transform: scale(.82); }
  }
</style>
